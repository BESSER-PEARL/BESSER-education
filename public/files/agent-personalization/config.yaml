# BAF configuration for the personalized Gym Agent (BESSER Labs "agent-personalization").
# Replace YOUR-API-KEY with your own OpenAI API key. Never commit this file with a real key.
# The database settings match the Dockerfile in the same folder.
agent:
  check_transitions_delay: 5

nlp:
  language: en
  region: US
  timezone: Europe/Madrid
  pre_processing: True
  intent_threshold: 0.4
  openai:
    api_key: YOUR-API-KEY

platforms:
  websocket:
    host: localhost
    port: 8765
    streamlit:
      host: localhost
      port: 5000

db:
  monitoring:
    enabled: True
    dialect: postgresql
    host: localhost
    port: 5432
    database: mydatabase
    username: myuser
    password: mysecretpassword
  streamlit:
    enabled: True
    dialect: postgresql
    host: localhost
    port: 5432
    database: mydatabase
    username: myuser
    password: mysecretpassword
